name: Django release
description: Verify exact-SHA Schema Maintenance on Railway; policy v1 also deploys the application, while v2 is schema-only.
inputs:
  policy:
    description: Path to a committed JSON policy (v1 schema and application, or explicit v2 schema-only).
    required: true
  github-token:
    description: Caller GITHUB_TOKEN with contents read, actions read, and deployments write.
    required: true
  railway-token:
    description: Railway project token scoped to the consumer environment.
    required: true
runs:
  using: composite
  steps:
    - name: Run the policy-selected schema-only or schema and application release
      shell: bash
      env:
        RELEASE_POLICY: ${{ inputs.policy }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
      run: python3 -B "$GITHUB_ACTION_PATH/controller.py" --policy "$RELEASE_POLICY"
