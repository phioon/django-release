name: Django release
description: Run fresh exact-SHA Django migrations on Railway and verify the current attempt; legacy v1/v2 remain supported.
inputs:
  policy:
    description: Path to a committed JSON policy (v3 migrations-only, or legacy v1/v2).
    required: true
  github-token:
    description: Required only for legacy v1/v2, with contents read, actions read, and deployments write. Unused by v3.
    required: false
  railway-token:
    description: Railway project token scoped to the consumer environment.
    required: true
runs:
  using: composite
  steps:
    - name: Run the policy-selected migration or legacy release
      shell: bash
      env:
        RELEASE_POLICY: ${{ inputs.policy }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
      run: python3 -B "$GITHUB_ACTION_PATH/controller.py" --policy "$RELEASE_POLICY"
